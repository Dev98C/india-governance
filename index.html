<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>India Governance — State Performance Observatory</title><style>
:root{--bg:#f5f6f8;--ink:#171b22;--muted:#667180;--line:#dfe3e8;--card:#fff;--bjp:#ee851f;--non:#3569df;--mix:#78838e;--green:#16855f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,select,input{font:inherit}header{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 34px;gap:38px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:17px}.mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(#ee851f 0 33%,#fff 33% 66%,#16855f 66%);display:grid;place-items:center;border:1px solid #ddd}.mark b{background:#fff9;padding:2px 4px;border-radius:5px}.sub{display:block;color:var(--muted);font-size:11px;font-weight:600}.nav{display:flex;gap:8px}.nav button{border:0;background:none;padding:11px 14px;border-radius:10px;font-weight:700;color:#5c6674;cursor:pointer}.nav button.active{color:#111;border:2px solid #2563eb;background:#f7fbff}.pill{margin-left:auto;border:1px solid var(--line);padding:9px 13px;border-radius:20px;color:#65707e}.view{display:none;max-width:1500px;margin:auto;padding:42px}.view.active{display:block}.hero{display:grid;grid-template-columns:1.7fr .8fr;gap:24px}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-weight:800;color:#6d7784;font-size:11px}h1{font-size:52px;line-height:1.02;margin:12px 0 18px;letter-spacing:-2px}h2{font-size:30px;margin:7px 0 16px;letter-spacing:-1px}h3{font-size:20px;margin:8px 0}.copy{font-size:18px;line-height:1.55;color:#596473;max-width:850px}.callout{background:#14181d;color:#fff;border-radius:24px;padding:30px;display:flex;flex-direction:column;justify-content:center;min-height:230px}.callout small{color:#aeb6c0;text-transform:uppercase;letter-spacing:1px}.callout .kicker{font-size:14px;font-weight:800;margin-top:10px}.callout strong{font-size:36px;margin:10px 0}.actions{display:flex;gap:10px;margin-top:20px}.btn{padding:12px 17px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800;cursor:pointer}.primary{background:#15191e;color:#fff;border-color:#15191e}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:28px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 1px 1px #00000005}.metric{font-size:31px;font-weight:850;margin:12px 0 4px}.section{margin-top:42px}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.table th,.table td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line)}.chip{display:inline-block;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800}.bjp{background:#fff0e2;color:#b85b0a}.non{background:#eaf0ff;color:#2458c7}.mix{background:#edf0f2;color:#59636d}.controls{display:flex;gap:12px;justify-content:flex-end}.input,.select{padding:12px 14px;border:1px solid var(--line);background:#fff;border-radius:11px}.stategrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.state{cursor:pointer;border-top:4px solid var(--non)}.state.bjpborder{border-top-color:var(--bjp)}.state.mixborder{border-top-color:var(--mix)}.statehead{display:flex;justify-content:space-between;align-items:start}.score{font-size:29px;font-weight:900}.twocol{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.sectionnav{display:flex;gap:8px;position:sticky;top:78px;background:var(--bg);padding:10px 0;z-index:5}.sectionnav a{padding:9px 12px;border:1px solid var(--line);background:#fff;border-radius:99px;color:#586373;text-decoration:none;font-weight:700}.detailhero{background:#192f55;color:#fff;border-radius:24px;padding:32px;display:flex;justify-content:space-between;align-items:end}.detailhero h1{margin-bottom:5px}.bigscore{font-size:64px;font-weight:900}.metricrow{display:grid;grid-template-columns:180px 1fr 100px;gap:15px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.bar{height:9px;background:#e9edf1;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--non)}.fill.bjpfill{background:var(--bjp)}.legend{display:flex;gap:20px;flex-wrap:wrap;font-weight:700;color:#596473;margin:14px 0}.dot{width:9px;height:9px;display:inline-block;border-radius:50%;margin-right:5px}.analytical{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.insight{border-radius:17px;padding:18px;background:#fff;border:1px solid var(--line)}.insight strong{display:block;font-size:17px;margin:7px 0}.politics{height:46px;border-radius:12px;overflow:hidden;display:flex;background:#eee;margin:14px 0}.seg{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:850}.seg.bjpseg{background:var(--bjp)}.seg.nonseg{background:var(--non)}.back{margin-bottom:20px}.note{color:var(--muted);line-height:1.5}@media(max-width:900px){.hero,.twocol{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,1fr)}.stategrid{grid-template-columns:1fr}.nav{display:none}.view{padding:24px}h1{font-size:40px}.analytical{grid-template-columns:1fr}.pill{display:none}}
</style></head><body><header><div class="brand"><div class="mark"><b>IG</b></div><div>India Governance<span class="sub">State Performance Observatory</span></div></div><nav class="nav" id="nav"></nav><div class="pill">Political window · 2006–2026</div></header><main id="app"></main><script>
const S=[['Odisha','Non-BJP-dominant',71.6,7,10.93,5.43,13.66,66,73.1,6.02,2.82,64.9,62.9,3.1,55.1,3.4,40,73,6.1,1461.74,6.7,26195.53,41.8,48.51],['Karnataka','Non-BJP-dominant',70.4,7.6,12.75,6.5,5.19,75,41.7,4.69,2.48,56.8,55.3,2.7,54.8,1.9,63,80,1.9,494317.81,11.1,43398.56,46.7,59.3],['Telangana','Non-BJP-dominant',62.8,6.7,12.39,5.91,7.3,74,44.3,4.92,2.33,62.2,59.2,4.8,62.5,.8,64,73,2,89591.53,4.1,16030.1,47.7,57.14],['Tamil Nadu','Non-BJP-dominant',62.1,6.6,11.57,5.96,2.56,78,29.8,5.88,2.78,58.8,56.7,3.5,72.6,6.9,76,77,1.5,138247.93,null,null,54.6,64.41],['Assam','BJP-dominant',59.1,7.11,12.26,5.83,13.3,65,39.1,5.42,1.19,66.9,64.3,3.9,54.9,-7.4,41,60,2.8,180.68,null,null,39.5,42.45],['Madhya Pradesh','BJP-dominant',54.2,6.1,12.76,4.76,15.94,67,37.8,6.95,1.19,68.9,68.2,1,42.1,-.6,49,56,4,4759.67,3.4,13293.25,42.9,57],['Haryana','BJP-dominant',50.4,6.5,11.42,4.76,4.81,72,34.5,4.58,3.15,49.5,47.8,3.4,72.6,13.3,77,73,1.3,110690.75,null,null,49.8,55.01],['Chhattisgarh','BJP-dominant',49.6,6,10.34,4.11,13.53,67,44.3,6.9,1.19,71.5,69.7,2.5,43,4.6,63,56,4,1176.45,null,null,42.1,48.5],['Uttar Pradesh','Non-BJP-dominant',49.1,6.1,11.34,4.24,14.75,67,41.9,4.02,3.12,56.9,55.1,3.1,46.8,1.5,54,61,5.7,17003.75,7.6,29714.33,39.9,62.09],['Uttarakhand','BJP-dominant',48.9,5,9.57,3.6,8,72,null,5.17,3.09,60.7,58.1,4.3,64,4.2,73,84,3.5,1820.12,null,null,41.9,52.07],['Maharashtra','Mixed',46.9,5.6,10.21,4.51,6.99,73,45,5.05,2.15,59,57.1,3.3,57.7,4.3,67,84,2,743224.85,11.7,45744.43,49.3,68.01],['Jharkhand','Non-BJP-dominant',45.7,5.51,9.92,3.96,13.29,62,50.5,6.73,2.73,63.8,63,1.3,56.7,0,61,77,4.7,19468.1,3.4,13293.25,35.2,42.49],['Rajasthan','Non-BJP-dominant',41.7,5.8,11.08,4.12,13.55,67,27.6,5.21,1.89,64.4,61.7,4.2,51.9,4.7,63,73,2.5,25900.55,3.6,14075.21,44.3,47.31],['Kerala','Non-BJP-dominant',35.7,5,9.94,4.51,.15,79,24.8,3.65,2.84,56.2,52.2,7.2,77.2,5.9,82,80,1.2,12505.8,null,null,48.9,53.76],['West Bengal','Non-BJP-dominant',35.1,4.7,10.09,3.71,9.4,70,23.8,6.16,2.84,61.1,59.6,2.5,63.3,4,60,79,1.9,15256.66,null,null,46,53.03],['Bihar','BJP-dominant',33.7,6.1,11.28,4.03,18.13,57,30.9,2.99,2.08,53.2,51.6,3,46.8,-7.3,32,67,3,1650.73,null,null,32.9,46.31],['Punjab','Mixed',30.4,5.4,9.21,3.67,.82,76,12.4,4.35,2.73,55.7,52.6,5.5,72.6,8.8,75,79,.9,9839.44,null,null,43.6,0]];
const names=['name','group','score','realGdp','nominalGdp','pc','poverty','sdg','fiscal','employment','infra','lfpr','wpr','unemp','nonAgri','servicesChange','education','health','capex','fdi','privateShare','privateCost','nsipi','epi'];let states=S.map(a=>Object.fromEntries(names.map((k,i)=>[k,a[i]])));
const nav=[['overview','Overview'],['states','States'],['compare','Compare'],['method','Methodology']];document.getElementById('nav').innerHTML=nav.map(x=>`<button data-v="${x[0]}">${x[1]}</button>`).join('');document.getElementById('nav').addEventListener('click',e=>{if(e.target.dataset.v)go(e.target.dataset.v)});
function gc(g){return g==='BJP-dominant'?'bjp':g==='Mixed'?'mix':'non'}function chip(g){return `<span class="chip ${gc(g)}">${g}</span>`}function go(v,state=null){if(v==='state')return detail(state);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));app.innerHTML={overview,states,compare,method}[v]();scrollTo(0,0);if(v==='states')renderCards();if(v==='compare')renderCompare()}
function overview(){let b=states.filter(s=>s.group==='BJP-dominant'),n=states.filter(s=>s.group==='Non-BJP-dominant');return `<section class="view active"><div class="hero"><div><div class="eyebrow">Research workbench</div><h1>A 20-Year Governance Report Card</h1><p class="copy">Compare state performance across growth, real incomes, poverty reduction, human development, fiscal health, labour markets, infrastructure and investment — without collapsing everything into politics alone.</p><div class="actions"><button class="btn primary" onclick="go('states')">Explore states</button><button class="btn" onclick="go('compare')">Compare states</button></div></div><div class="callout"><small>Current read</small><div class="kicker">BJP vs Non-BJP States</div><strong>No simple winner</strong><span>The preliminary composite is close by median state, while population weighting favours the non-BJP group.</span></div></div><div class="grid4"><div class="card"><b>BJP median</b><div class="metric">${med(b.map(s=>s.score)).toFixed(1)}</div></div><div class="card"><b>Non-BJP median</b><div class="metric">${med(n.map(s=>s.score)).toFixed(1)}</div></div><div class="card"><b>Non-BJP weighted score</b><div class="metric">${wavg(n,'score').toFixed(1)}</div></div><div class="card"><b>Real GSDP weighted growth</b><div class="metric">${wavg(b,'realGdp').toFixed(2)}% vs ${wavg(n,'realGdp').toFixed(2)}%</div></div></div><div class="section"><div class="eyebrow">National comparison</div><h2>Group-level dashboard</h2>${summaryTable()}</div><div class="section"><div class="eyebrow">State leaderboard</div><h2>Top 10 preliminary scores</h2>${leaderboard()}</div></section>`}
function summaryTable(){return `<table class="table"><thead><tr><th>Group</th><th>Median</th><th>Weighted score</th><th>Real GSDP</th><th>Real PC NSDP</th><th>SDG</th><th>Employment</th><th>Infrastructure</th></tr></thead><tbody>${['BJP-dominant','Non-BJP-dominant','Mixed'].map(g=>{let a=states.filter(s=>s.group===g);return `<tr><td>${chip(g)}</td><td>${med(a.map(s=>s.score)).toFixed(1)}</td><td>${wavg(a,'score').toFixed(1)}</td><td>${wavg(a,'realGdp').toFixed(2)}%</td><td>${wavg(a,'pc').toFixed(2)}%</td><td>${wavg(a,'sdg').toFixed(1)}</td><td>${wavg(a,'employment').toFixed(2)}</td><td>${wavg(a,'infra').toFixed(2)}</td></tr>`}).join('')}</tbody></table>`}
function leaderboard(){return `<table class="table"><thead><tr><th>Rank</th><th>State</th><th>Group</th><th>Score</th><th>Real GSDP CAGR</th><th>Real PC NSDP CAGR</th><th>SDG</th></tr></thead><tbody>${[...states].sort((a,b)=>b.score-a.score).slice(0,10).map((s,i)=>`<tr onclick="detail('${s.name}')" style="cursor:pointer"><td>${i+1}</td><td><b>${s.name}</b></td><td>${chip(s.group)}</td><td>${s.score.toFixed(1)}</td><td>${s.realGdp.toFixed(2)}%</td><td>${s.pc.toFixed(2)}%</td><td>${s.sdg}</td></tr>`).join('')}</tbody></table>`}
function states(){return `<section class="view active"><div class="section"><div class="eyebrow">State explorer</div><h1>Explore the states</h1><div class="controls"><input class="input" id="q" placeholder="Search a state…" oninput="renderCards()"><select class="select" id="sort" onchange="renderCards()"><option value="score">Composite</option><option value="realGdp">Real GSDP CAGR</option><option value="pc">Real PC NSDP CAGR</option><option value="poverty">Poverty reduction</option><option value="sdg">Human development</option><option value="fiscal">Fiscal health</option></select></div><div class="stategrid" id="stategrid"></div></div></section>`}
function renderCards(){let q=(document.getElementById('q')?.value||'').toLowerCase(),k=document.getElementById('sort')?.value||'score',a=states.filter(s=>s.name.toLowerCase().includes(q)).sort((x,y)=>(y[k]??-1)-(x[k]??-1));document.getElementById('stategrid').innerHTML=a.map(s=>`<article class="card state ${gc(s.group)}border" onclick="detail('${s.name}')"><div class="statehead">${chip(s.group)}<span class="score">${s[k]!=null?s[k].toFixed(k==='score'?1:2):'—'}</span></div><h3>${s.name}</h3><div class="note">Composite ${s.score.toFixed(1)}/100</div><div class="metricrow"><span>Real GSDP CAGR</span><b>${s.realGdp.toFixed(2)}%</b><span></span></div><div class="metricrow"><span>Real PC NSDP CAGR</span><b>${s.pc.toFixed(2)}%</b><span></span></div><div class="metricrow"><span>SDG score</span><b>${s.sdg}</b><span></span></div></article>`).join('')}
function detail(name){let s=states.find(x=>x.name===name);if(!s)return;app.innerHTML=`<section class="view active"><button class="btn back" onclick="go('states')">← Back to states</button><div class="detailhero"><div>${chip(s.group)}<h1>${s.name}</h1><p class="copy" style="color:#dbe4f2">State-level view of growth, income, poverty, human development, fiscal health, labour market, infrastructure and investment.</p></div><div><div class="eyebrow" style="color:#cbd7e6">Composite score</div><div class="bigscore">${s.score.toFixed(1)}</div></div></div><div class="sectionnav"><a href="#core">Core</a><a href="#labour">Labour</a><a href="#human">Human development</a><a href="#infra">Infrastructure</a><a href="#investment">Investment</a><a href="#last5" onclick="last5('${s.name}')">Last 5 years →</a></div>${core(s)}${labour(s)}${human(s)}${infra(s)}${investment(s)}<div class="section" id="read"><div class="eyebrow">Analytical read</div><h2>What the evidence suggests</h2><div class="analytical"><div class="insight"><span class="chip non">Country context</span><strong>${s.realGdp>5.98?'Growth is above':'Growth is below'} the national benchmark</strong><p class="note">Real GSDP CAGR is ${s.realGdp.toFixed(2)}% versus India at 5.98%. This is an output measure, not by itself evidence of policy causality.</p></div><div class="insight"><span class="chip non">Non-BJP benchmark</span><strong>${s.score>=med(states.filter(x=>x.group==='Non-BJP-dominant').map(x=>x.score))?'Composite sits at or above':'Composite sits below'} the non-BJP median</strong><p class="note">The comparison describes the distribution of the sample; it does not isolate the effect of political control.</p></div><div class="insight"><span class="chip mix">State trajectory</span><strong>Read the components, not the composite alone</strong><p class="note">Growth, development, fiscal health, labour and investment can move in different directions. The composite is a summary, not a causal diagnosis.</p></div></div></div></section>`;scrollTo(0,0)}
function core(s){return `<div class="section" id="core"><div class="eyebrow">Core indicators</div><h2>Economic performance</h2><div class="twocol"><div class="card">${metric('Real GSDP CAGR',s.realGdp,5.98,'%')} ${metric('Nominal GSDP CAGR',s.nominalGdp,10.5,'%')} ${metric('Real PC NSDP CAGR',s.pc,null,'%')} ${metric('Poverty reduction',s.poverty,9.89,' pp')} ${metric('SDG score',s.sdg,71,'')} ${metric('Fiscal Health Index',s.fiscal,null,'')}</div><div class="card"><h3>Sectoral GVA CAGR</h3><div class="note">FY2011-12 → FY2024-25 · real terms</div><div class="metricrow"><span>Agriculture</span><b>State / India</b><span></span></div><div class="metricrow"><span>Industry</span><b>State / India</b><span></span></div><div class="metricrow"><span>Services</span><b>State / India</b><span></span></div></div></div></div>`}
function metric(label,v,bench,suf){return `<div class="metricrow"><span>${label}</span><div class="bar"><div class="fill ${gc(s.group)==='bjp'?'bjpfill':''}" style="width:${Math.max(0,Math.min(100,(v??0)/(bench||10)*100))}%"></div></div><b>${v==null?'—':v.toFixed(2)}${suf}</b></div>`}
function labour(s){return `<div class="section" id="labour"><div class="eyebrow">Labour market</div><h2>Labour absorption & structure</h2><div class="grid4">${[['LFPR',s.lfpr,'%'],['WPR',s.wpr,'%'],['Unemployment',s.unemp,'%'],['Non-agricultural employment',s.nonAgri,'%']].map(x=>`<div class="card"><b>${x[0]}</b><div class="metric">${x[1]}${x[2]}</div></div>`).join('')}</div><div class="card"><div class="metricrow"><span>Services employment change</span><b>${s.servicesChange>0?'+':''}${s.servicesChange} pp</b><span></span></div><p class="note">Employment score: ${s.employment.toFixed(2)}/10. These indicators should be read together; low unemployment can coexist with low productivity or weak participation.</p></div></div>`}
function human(s){return `<div class="section" id="human"><div class="eyebrow">Human development</div><h2>Education & health outcomes</h2><div class="twocol"><div class="card"><h3>Quality education · SDG 4</h3><div class="metric">${s.education}</div><p class="note">India benchmark 61</p><div class="bar"><div class="fill" style="width:${s.education}%"></div></div></div><div class="card"><h3>Good health & well-being · SDG 3</h3><div class="metric">${s.health}</div><p class="note">India benchmark 77</p><div class="bar"><div class="fill" style="width:${s.health}%"></div></div></div></div></div>`}
function infra(s){return `<div class="section" id="infra"><div class="eyebrow">Infrastructure</div><h2>Infrastructure readiness</h2><div class="grid4"><div class="card"><b>Infrastructure score</b><div class="metric">${s.infra.toFixed(2)}<small>/5</small></div></div><div class="card"><b>LEADS 2024</b><div class="metric">—</div></div><div class="card"><b>Export Preparedness</b><div class="metric">${s.epi}</div></div><div class="card"><b>Charging readiness</b><div class="metric">—</div></div></div></div>`}
function investment(s){return `<div class="section" id="investment"><div class="eyebrow">Investment</div><h2>Public, private and foreign capital</h2><div class="grid4"><div class="card"><b>Public capital outlay</b><div class="metric">${s.capex}%</div></div><div class="card"><b>FDI equity inflow</b><div class="metric">₹${s.fdi.toLocaleString('en-IN')}</div><span class="note">₹ crore · cumulative proxy</span></div><div class="card"><b>Private project share</b><div class="metric">${s.privateShare==null?'—':s.privateShare+'%'}</div></div><div class="card"><b>N-SIPI</b><div class="metric">${s.nsipi}</div></div></div></div>`}
function compare(){return `<section class="view active"><div class="eyebrow">Comparison studio</div><h1>Compare two states</h1><div class="controls"><select class="select" id="ca">${states.map(s=>`<option>${s.name}</option>`).join('')}</select><b>VS</b><select class="select" id="cb">${states.map(s=>`<option>${s.name}</option>`).join('')}</select></div><div id="cmp" class="section"></div></section>`}
function renderCompare(){let a=states.find(s=>s.name===document.getElementById('ca').value),b=states.find(s=>s.name===document.getElementById('cb').value);let rows=[['Composite score',a.score,b.score],['Real GSDP CAGR',a.realGdp,b.realGdp],['Nominal GSDP CAGR',a.nominalGdp,b.nominalGdp],['Real PC NSDP CAGR',a.pc,b.pc],['Poverty reduction',a.poverty,b.poverty],['SDG score',a.sdg,b.sdg],['Fiscal Health Index',a.fiscal,b.fiscal],['Employment score',a.employment,b.employment],['Infrastructure score',a.infra,b.infra],['LFPR',a.lfpr,b.lfpr],['Unemployment',a.unemp,b.unemp]];document.getElementById('cmp').innerHTML=`<div class="card"><div class="legend"><span><i class="dot" style="background:${gc(a.group)==='bjp'?'var(--bjp)':gc(a.group)==='non'?'var(--non)':'var(--mix)'}"></i>${a.name}</span><span><i class="dot" style="background:${gc(b.group)==='bjp'?'var(--bjp)':gc(b.group)==='non'?'var(--non)':'var(--mix)'}"></i>${b.name}</span></div>${rows.map(r=>`<div class="metricrow"><span><b>${r[0]}</b></span><div><div style="display:flex;gap:4px"><div class="bar"><div class="fill ${gc(a.group)==='bjp'?'bjpfill':''}" style="width:${(r[1]??0)/Math.max(r[1]??0,r[2]??0,1)*100}%"></div></div><div class="bar"><div class="fill ${gc(b.group)==='bjp'?'bjpfill':''}" style="width:${(r[2]??0)/Math.max(r[1]??0,r[2]??0,1)*100}%"></div></div></div><small class="note">${r[1]??'—'} vs ${r[2]??'—'}</small></div><span></span></div>`).join('')}</div>`;document.getElementById('ca').onchange=renderCompare;document.getElementById('cb').onchange=renderCompare}
function method(){return `<section class="view active"><div class="eyebrow">Methodology</div><h1>How the research model works</h1><div class="grid4"><div class="card"><b>Political classification</b><p class="note">BJP-led coalitions count as BJP; non-BJP-led coalitions as non-BJP. Mixed is reserved for roughly 45–55% of the 20-year window.</p></div><div class="card"><b>Economic window</b><p class="note">FY2011-12 to FY2024-25 where comparable state series exist.</p></div><div class="card"><b>Composite weights</b><p class="note">Real GSDP 20%; real PC NSDP 15%; poverty 15%; human development 20%; fiscal 15%; employment 10%; infrastructure 5%.</p></div><div class="card"><b>Nominal GSDP</b><p class="note">Diagnostic only, not separately scored.</p></div></div></section>`}
function med(a){a=a.filter(x=>x!=null).sort((x,y)=>x-y);return a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2}function wavg(a,k){a=a.filter(s=>s[k]!=null);let p=a.reduce((x,s)=>x+(s.pop||0),0);return a.reduce((x,s)=>x+s[k]*(s.pop||0),0)/p}states.forEach(s=>{s.pop={Odisha:41974218,Karnataka:61095297,Telangana:35003674,'Tamil Nadu':72147030,Assam:31205576,'Madhya Pradesh':72626809,Haryana:25351462,Chhattisgarh:25545198,'Uttar Pradesh':199812341,Uttarakhand:10086292,Maharashtra:112374333,Jharkhand:32988134,Rajasthan:68548437,Kerala:33406061,'West Bengal':91276115,Bihar:104099452,Punjab:27743338}[s.name]||0});const app=document.getElementById('app');go('overview');
</script></body></html>
